<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css 3d transform rotation</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: system-ui;
        }
        .body{
            background-color:black;
            min-height: 100vh;    
            display: flex;   
            justify-content: center; 
            align-content: center;
            overflow: hidden;
        }
        .box{
            position: relative;
            height:350px;
            width: 50%;
            transform-style: preserve-3d;
        }
        .box div{
            position: absolute;
            height: 100%;
            width: 100%;
            transform-style: preserve-3d;
            animation: animate 24s linear infinite;
        }
        @keyframes animate {
          0%{
            transform: perspective(1000px) rotateX(0deg);
          }
          50%{
            transform: perspective(1000px) rotateX(350deg);
          }
        }
        
           .box div span{
            position:absolute;
            inset: 0;
            /* background-color:#25BE66; */
            transform: rotateX(calc(var(--i) * 15deg));
            display:flex;
            justify-content: center;
            align-items: center;
           }
           .box div span::before{
            content: 'Payal';
            position: absolute;
            width: 100%;
            height: 100px;
            color:#d26684;
            text-align: center;
            text-transform: uppercase;
            font-size: 8rem;
            font-weight: 800;
            -webkit-text-stroke: 2px #000;
            text-shadow: 0 0 50px rgba(0, 0, 0, 0.3);
           }
           .box div span:nth-child(3n+2):before
           {
            color:#df9294;
           }
           .box div span:nth-child(3n+3):before
           {
            color:#e5a8a9;
           }
    </style>
</head>
<body>
    <div class="box">
        <div>
            <span style="--i:1;"></span>
            <span style="--i:2;"></span>
            <span style="--i:3;"></span>
            <span style="--i:4;"></span>
            <span style="--i:5;"></span>
            <span style="--i:6;"></span>
            <span style="--i:7;"></span>

</body>
</html>
